server:
  port: 8080

spring:
  application:
    name: serviciu-cafenea # <--- Această linie îi dă nume de microserviciu în rețea!
  datasource:
    url: jdbc:postgresql://localhost:5432/cafenea_db
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Configurare minimală de rețea (Se preface că trimite datele către un punct central)
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false