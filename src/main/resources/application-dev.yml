server:
  port: 8080

spring:
  application:
    name: serviciu-cafenea
  datasource:
    url: jdbc:postgresql://localhost:5432/cafenea_db
    username: postgres
    password: root
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
