<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: iFrame(~{::body})}">
<body>
<div class="container-lg">
    <div class="card border-0 shadow-sm rounded-4 p-3 p-lg-4">

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4 border-bottom pb-3">
        <ul class="nav nav-pills gap-2">
            <li class="nav-item">
                <a class="nav-link fw-bold px-4 text-secondary" href="/produse">📦 Catalog Produse</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active fw-bold px-4 shadow-sm" href="/categorii">📁 Categorii Meniu</a>
            </li>
        </ul>
    </div>

    <div class="mb-4">
        <h3 class="fw-bold text-dark m-0">📁 Configurare Categorii</h3>
        <p class="text-muted small m-0">Setați grupele principale din meniul cafenelei</p>
    </div>

    <div th:if="${eroare}" class="alert alert-danger border-0 shadow-sm rounded-3 mb-4" th:text="${eroare}"></div>
    <div th:if="${succes}" class="alert alert-success border-0 shadow-sm rounded-3 mb-4" th:text="${succes}"></div>

    <div class="row g-4">
        <div class="col-md-4" sec:authorize="hasRole('ADMIN')">
            <div class="card p-4 bg-body-tertiary border-0 rounded-4">
                <h5 class="fw-bold text-dark mb-3"
                    th:text="${categorieNoua.id != null} ? '📝 Editează Categorie' : '➕ Adaugă Categorie'">Adaugă Categorie</h5>

                <form th:action="@{/categorii/salveaza}" th:object="${categorieNoua}" method="post">
                    <input type="hidden" th:field="*{id}" />

                    <div class="mb-3">
                        <label for="denumire" class="form-label fw-semibold text-muted small">Denumire Categorie</label>
                        <input type="text" th:field="*{denumire}" id="denumire"
                               class="form-control bg-white"
                               th:classappend="${#fields.hasErrors('denumire')} ? 'is-invalid' : ''"
                               placeholder="ex: Băuturi calde, Ceaiuri" />

                        <div class="invalid-feedback" th:if="${#fields.hasErrors('denumire')}" th:errors="*{denumire}"></div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success w-100 fw-bold shadow-sm">💾 Salvează</button>
                        <a th:if="${categorieNoua.id != null}" href="/categorii" class="btn btn-outline-secondary">Anulează</a>
                    </div>
                </form>
            </div>
        </div>

        <div th:class="${#lists.contains(#authentication.authorities.![authority], 'ROLE_ADMIN')} ? 'col-md-8' : 'col-md-12'">
            <div class="table-responsive rounded-3 border">
                <table class="table table-hover align-middle text-center m-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="text-nowrap">ID</th>
                        <th class="text-start">Denumire Categorie</th>
                        <th class="text-nowrap" sec:authorize="hasRole('ADMIN')">Acțiuni</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="cat : ${listaCategorii}">
                        <td th:text="${cat.id}" class="fw-bold text-muted">1</td>
                        <td th:text="${cat.denumire}" class="text-start fw-semibold text-dark">Nume</td>
                        <td sec:authorize="hasRole('ADMIN')">
                            <div class="d-flex justify-content-center gap-1">
                                <a th:href="@{/categorii/editeaza/{id}(id=${cat.id})}" class="btn btn-sm btn-warning">Editează</a>
                                <a th:href="@{/categorii/sterge/{id}(id=${cat.id})}" onclick="return confirm('Sigur ștergi?')" class="btn btn-sm btn-danger">Elimină</a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    </div>
</div>
</body>
</html>
