<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: iFrame(~{::body})}">
<body>
<div class="container-sm">
    <div class="card border-0 shadow-sm rounded-4 p-3 p-lg-4">

    <h3 class="fw-bold text-dark mb-4"
        th:text="${produs.id != null} ? '📝 Editează Produs' : '➕ Adaugă Produs Nou'">Adaugă Produs Nou</h3>

    <form th:action="@{/produse/salveaza}" th:object="${produs}" method="post" class="row g-3">

        <input type="hidden" th:field="*{id}" />

        <div class="col-12">
            <label for="nume" class="form-label fw-bold">Denumire Produs</label>
            <input type="text" th:field="*{nume}" id="nume" class="form-control" required />
            <div class="text-danger small" th:if="${#fields.hasErrors('nume')}" th:errors="*{nume}">Eroare nume</div>
        </div>

        <div class="col-12">
            <label for="pret" class="form-label fw-bold">Preț Unitar (RON)</label>
            <input type="number" step="0.01" th:field="*{pret}" id="pret" class="form-control" required />
            <div class="text-danger small" th:if="${#fields.hasErrors('pret')}" th:errors="*{pret}">Eroare preț</div>
        </div>

        <div class="col-12">
            <label for="categorie" class="form-label fw-bold">Categorie Produs</label>
            <select th:field="*{categorie}" id="categorie" class="form-select" required>
                <option value="">-- Selectează o categorie --</option>
                <option th:each="cat : ${categorii}"
                        th:value="${cat.id}"
                        th:text="${cat.denumire}"></option>
            </select>
            <div class="text-danger small" th:if="${#fields.hasErrors('categorie')}" th:errors="*{categorie}">Eroare categorie</div>
        </div>

        <div class="col-12">
            <label for="ingrediente" class="form-label fw-bold">Ingrediente</label>
            <select th:field="*{ingrediente}" id="ingrediente" class="form-select" multiple size="5">
                <option th:each="ingredient : ${ingrediente}"
                        th:value="${ingredient.id}"
                        th:text="${ingredient.numeIngredient}"></option>
            </select>
        </div>

        <div class="col-12 d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-success w-100 fw-bold">💾 Salvează în Sistem</button>
            <a href="/produse" class="btn btn-outline-secondary w-100 fw-bold">Anulează</a>
        </div>
    </form>
    </div>
</div>
</body>
</html>
