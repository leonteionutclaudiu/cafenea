<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Adaugă Produs</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow-sm p-4 rounded-4 bg-white">
        <h4 class="fw-bold text-dark mb-4 text-center">Adăugare Produs Nou</h4>

        <form th:action="@{/produse/salveaza}" th:object="${produs}" method="post">

            <div class="mb-3">
                <label class="form-label fw-semibold">Nume Produs</label>
                <input type="text" th:field="*{nume}" class="form-control" placeholder="ex: Caffè Latte" />
                <div th:if="${#fields.hasErrors('nume')}" th:errors="*{nume}" class="text-danger small mt-1 fw-medium"></div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Preț (RON)</label>
                <input type="number" step="0.1" th:field="*{pret}" class="form-control" placeholder="0.00" />
                <div th:if="${#fields.hasErrors('pret')}" th:errors="*{pret}" class="text-danger small mt-1 fw-medium"></div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success w-100 fw-bold py-2">Salvează Produsul</button>
                <a href="/produse" class="btn btn-light border w-100 fw-semibold py-2">Anulează</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
