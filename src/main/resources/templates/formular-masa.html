<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: iFrame(~{::body})}">
<body>
<div class="container-sm">
    <div class="card border-0 shadow-sm rounded-4 p-3 p-lg-4">
        <h3 class="fw-bold text-dark mb-4"
            th:text="${masa.id != null} ? 'Editeaza Masa' : 'Adauga Masa Noua'">Adauga Masa</h3>

        <div th:if="${eroare}" class="alert alert-danger" th:text="${eroare}"></div>

        <form th:action="@{/mese/salveaza}" th:object="${masa}" method="post" class="row g-3">
            <input type="hidden" th:field="*{id}" />

            <div class="col-12">
                <label class="form-label fw-bold">Numar masa</label>
                <input type="number" th:field="*{numarMasa}" class="form-control" required min="1" max="200" />
                <div class="text-danger small" th:if="${#fields.hasErrors('numarMasa')}" th:errors="*{numarMasa}"></div>
            </div>

            <div class="col-12">
                <label class="form-label fw-bold">Status</label>
                <select th:field="*{status}" class="form-select" required>
                    <option value="">-- Selecteaza statusul --</option>
                    <option value="LIBERA">LIBERA</option>
                    <option value="OCUPATA">OCUPATA</option>
                </select>
                <div class="text-danger small" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
            </div>

            <div class="col-12 d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-success w-100 fw-bold">Salveaza</button>
                <a href="/mese" class="btn btn-outline-secondary w-100 fw-bold">Anuleaza</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
