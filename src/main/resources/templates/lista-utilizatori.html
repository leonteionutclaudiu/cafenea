<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: iFrame(~{::#utilizatoriContent})}">
<head><title>Utilizatori & Fidelitate</title></head>
<body>
<div id="utilizatoriContent" class="container mt-4 animate__animated animate__fadeIn">
    <div class="glass-card p-4">
        <h2 class="fw-bold mb-4 text-dark">👤 Clienți & Personalul Cafenelei</h2>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nume Utilizator</th>
                    <th>Rol Sistem</th>
                    <th>💳 Card Fidelitate Activat</th>
                    <th>Puncte Bonus</th>
                    <th class="text-center">Acțiuni Card</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${utilizatori}">
                    <td th:text="${user.id}">1</td>
                    <td th:text="${user.username}" class="fw-bold">Ospătar1</td>
                    <td>
                        <span class="badge bg-info text-dark fw-bold" th:text="${user.rol}">USER</span>
                    </td>
                    <td>
                        <span th:if="${user.cardFidelitate != null}" th:text="${user.cardFidelitate.codCard}" class="font-monospace fw-bold text-success">CAFE-A1B2C3D4</span>
                        <span th:if="${user.cardFidelitate == null}" class="text-muted small">Fără card activat</span>
                    </td>
                    <td>
                        <span th:if="${user.cardFidelitate != null}" th:text="${user.cardFidelitate.puncteAcumulate} + ' puncte'" class="fw-bold">10 puncte</span>
                        <span th:if="${user.cardFidelitate == null}">-</span>
                    </td>
                    <td class="text-center">
                        <a th:if="${user.cardFidelitate == null}" th:href="@{/utilizatori/genereaza-card/{id}(id=${user.id})}" class="btn btn-sm btn-success fw-bold btn-animate">✨ Activează Card</a>
                        <a th:if="${user.cardFidelitate != null}" th:href="@{/utilizatori/sterge-card/{id}(id=${user.cardFidelitate.id})}" class="btn btn-sm btn-danger fw-bold btn-animate"
                           onclick="return confirm('Sigur doriți să dezactivați acest card de fidelitate?')">❌ Dezactivează</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
