<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: iFrame(~{::#utilizatoriContent})}">
<head>
    <title>Utilizatori & Fidelitate</title>
</head>
<body>
<div id="utilizatoriContent" class="container-xl">
    <div class="card border-0 shadow-sm rounded-4 p-3 p-lg-4">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
                <h2 class="fw-bold mb-1 text-dark">👤 Personalul Cafenelei</h2>
                <p class="text-secondary small mb-0">Conturi, roluri si profiluri angajati</p>
            </div>

            <a th:href="@{/register}"
               sec:authorize="hasRole('ADMIN') or hasRole('MANAGER')"
               class="btn btn-success fw-bold">
                ➕ Adaugă Personal Nou
            </a>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/utilizatori}" method="get" class="row g-2 mb-4 bg-body-tertiary p-3 rounded-4 border">
            <input type="hidden" name="sortField" th:value="${sortField}"/>
            <input type="hidden" name="sortDir" th:value="${sortDir}"/>
            <div class="col-md-8">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Caută utilizator după username..." />
            </div>
            <div class="col-md-4 d-flex flex-column flex-sm-row gap-2">
                <button type="submit" class="btn btn-dark w-100 fw-bold">🔍 Caută</button>
                <a th:href="@{/utilizatori}" class="btn btn-outline-secondary w-100 fw-bold">Reset</a>
            </div>
        </form>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Rol</th>
                    <th>Detalii Profil</th>
                    <th class="text-center">Acțiuni</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${utilizatori}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.username}" class="fw-bold"></td>
                    <td><span class="badge bg-info text-dark" th:text="${user.rol}"></span></td>
                    <td>
                        <div th:if="${user.profil != null}">
                            <div th:text="${user.profil.numeComplet}"></div>
                            <small class="text-muted" th:text="${user.profil.telefon}"></small>
                        </div>
                        <span th:if="${user.profil == null}" class="text-muted small">Nespecificat</span>
                    </td>
                    <td class="text-center text-nowrap">
                        <a th:href="@{/utilizatori/editeaza-profil/{id}(id=${user.id})}"
                           th:if="${#authentication.name == user.username or #authorization.expression('hasRole(''ADMIN'')') or #authorization.expression('hasRole(''MANAGER'')')}"
                           class="btn btn-sm btn-info me-1">👤 Profil</a>

                        <a th:href="@{/utilizatori/sterge/{id}(id=${user.id})}"
                           sec:authorize="hasRole('ADMIN') or hasRole('MANAGER')"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Sigur ștergi acest utilizator?')">🗑️</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mt-4">
            <div class="text-muted small">
                Total: <span th:text="${totalItems}" class="fw-bold"></span> utilizatori.
                Pagina <span th:text="${totalItems > 0 ? currentPage : 0}"></span> din <span th:text="${totalPages}"></span>
            </div>
            <nav>
                <ul class="pagination pagination-sm m-0">
                    <li class="page-item" th:classappend="${currentPage == 1 || totalPages == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/utilizatori(page=${currentPage - 1}, keyword=${keyword}, sortField=${sortField}, sortDir=${sortDir})}">Înapoi</a>
                    </li>
                    <li th:each="i : ${totalPages > 0 ? #numbers.sequence(1, totalPages) : #numbers.sequence(0, 0)}"
                        class="page-item" th:classappend="${currentPage == i} ? 'active'">
                        <a class="page-link" th:href="@{/utilizatori(page=${i}, keyword=${keyword}, sortField=${sortField}, sortDir=${sortDir})}" th:text="${i}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages || totalPages == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/utilizatori(page=${currentPage + 1}, keyword=${keyword}, sortField=${sortField}, sortDir=${sortDir})}">Înainte</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
