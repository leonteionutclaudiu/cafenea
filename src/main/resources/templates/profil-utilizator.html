<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: iFrame(~{::#profilContent})}">
<head>
    <title>Editare Profil</title>
</head>
<body>

<div id="profilContent" class="container-md">
    <div class="card border-0 shadow-sm rounded-4 p-3 p-lg-4">
        <h2 class="fw-bold mb-4 text-dark">👤 Editare Profil: <span th:text="${utilizator.username}"></span></h2>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <form th:action="@{/utilizatori/salveaza-profil}" th:object="${profil}" method="post">

            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                <p>Te rugăm să corectezi următoarele erori:</p>
                <ul>
                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                </ul>
            </div>

            <input type="hidden" name="utilizatorId" th:value="${utilizator.id}" />
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label class="form-label fw-bold">Nume Complet:</label>
                <input type="text" th:field="*{numeComplet}"
                       th:classappend="${#fields.hasErrors('numeComplet')} ? 'is-invalid' : ''"
                       class="form-control" required />
                <div class="invalid-feedback" th:if="${#fields.hasErrors('numeComplet')}" th:errors="*{numeComplet}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Adresă:</label>
                <input type="text" th:field="*{adresa}"
                       th:classappend="${#fields.hasErrors('adresa')} ? 'is-invalid' : ''"
                       class="form-control" />
                <div class="invalid-feedback" th:if="${#fields.hasErrors('adresa')}" th:errors="*{adresa}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Telefon:</label>
                <input type="text" th:field="*{telefon}"
                       th:classappend="${#fields.hasErrors('telefon')} ? 'is-invalid' : ''"
                       class="form-control"
                       pattern="07[0-9]{8}"
                       title="Numărul trebuie să înceapă cu 07 și să aibă 10 cifre" />
                <div class="invalid-feedback" th:if="${#fields.hasErrors('telefon')}" th:errors="*{telefon}"></div>
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary fw-bold px-4">💾 Salvează Modificările</button>
                <a th:href="@{/utilizatori}" class="btn btn-outline-secondary px-4">Înapoi</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
