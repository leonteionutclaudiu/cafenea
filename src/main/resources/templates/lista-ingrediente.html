<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: iFrame(~{::#ingredientContent})}">
<head><title>Ingrediente</title></head>
<body>
<div id="ingredientContent" class="container mt-4 animate__animated animate__fadeIn">
    <div class="glass-card p-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold m-0 text-dark">🥛 Inventar Ingrediente</h2>
            <a href="/ingrediente/nou" class="btn btn-primary fw-bold btn-animate px-4 shadow-sm">➕ Adaugă Ingredient</a>
        </div>

        <form th:action="@{/ingrediente}" method="get" class="row g-2 mb-4">
            <input type="hidden" name="sortField" th:value="${sortField}"/>
            <input type="hidden" name="sortDir" th:value="${sortDir}"/>
            <div class="col-md-8">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Caută ingredient după nume..." />
            </div>
            <div class="col-md-4 d-flex gap-2">
                <button type="submit" class="btn btn-dark w-100 fw-bold">🔍 Caută</button>
                <a th:href="@{/ingrediente}" class="btn btn-outline-secondary w-100 fw-bold">Reset</a>
            </div>
        </form>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>
                        <a th:href="@{/ingrediente(page=${currentPage}, keyword=${keyword}, sortField='numeIngredient', sortDir=${reverseSortDir})}" class="text-white text-decoration-none">
                            Nume Ingredient <span th:text="${sortField == 'numeIngredient'} ? (${sortDir == 'asc'} ? '▲' : '▼') : ''"></span>
                        </a>
                    </th>
                    <th>
                        <a th:href="@{/ingrediente(page=${currentPage}, keyword=${keyword}, sortField='cantitateStoc', sortDir=${reverseSortDir})}" class="text-white text-decoration-none">
                            Cantitate în Stoc <span th:text="${sortField == 'cantitateStoc'} ? (${sortDir == 'asc'} ? '▲' : '▼') : ''"></span>
                        </a>
                    </th>
                    <th class="text-center">Acțiuni</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ing : ${ingrediente}">
                    <td th:text="${ing.id}">1</td>
                    <td th:text="${ing.numeIngredient}" class="fw-bold text-dark">Lapte</td>
                    <td>
                        <span class="badge bg-secondary px-3 py-2 fs-6" th:text="${ing.cantitateStoc}">50</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/ingrediente/editeaza/{id}(id=${ing.id})}" class="btn btn-sm btn-warning fw-bold btn-animate me-1">✏️</a>
                        <a th:href="@{/ingrediente/sterge/{id}(id=${ing.id})}" class="btn btn-sm btn-danger fw-bold btn-animate"
                           onclick="return confirm('Sigur vrei să ștergi acest ingredient?')">❌</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(ingrediente)}">
                    <td colspan="4" class="text-center text-muted py-4">Nu s-au găsit ingrediente care să corespundă căutării.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-4">
            <div class="text-muted small">
                Total: <span th:text="${totalItems}" class="fw-bold"></span> ingrediente.
                Pagina <span th:text="${totalItems > 0 ? currentPage : 0}"></span> din <span th:text="${totalPages}"></span>
            </div>
            <nav>
                <ul class="pagination pagination-sm m-0">
                    <li class="page-item" th:classappend="${currentPage == 1 || totalPages == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/ingrediente(page=${currentPage - 1}, keyword=${keyword}, sortField=${sortField}, sortDir=${sortDir})}">Înapoi</a>
                    </li>

                    <li th:each="i : ${totalPages > 0 ? #numbers.sequence(1, totalPages) : #annotationList}"
                        class="page-item" th:classappend="${currentPage == i} ? 'active'">
                        <a class="page-link" th:href="@{/ingrediente(page=${i}, keyword=${keyword}, sortField=${sortField}, sortDir=${sortDir})}" th:text="${i}">1</a>
                    </li>

                    <li class="page-item" th:classappend="${currentPage == totalPages || totalPages == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/ingrediente(page=${currentPage + 1}, keyword=${keyword}, sortField=${sortField}, sortDir=${sortDir})}">Înainte</a>
                    </li>
                </ul>
            </nav>
        </div>

    </div>
</div>
</body>
</html>
