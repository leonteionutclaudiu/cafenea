<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="iFrame(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafea Hub</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="bg-body-tertiary min-vh-100 d-flex flex-column">

<nav class="navbar navbar-expand-xl navbar-dark bg-dark sticky-top shadow">
    <div class="container-fluid px-3 px-lg-4">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
            <span class="badge rounded-pill text-bg-light text-dark">CH</span>
            <span>Cafea Hub</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Deschide meniul">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto align-items-xl-center gap-xl-1 py-3 py-xl-0" sec:authorize="isAuthenticated()">
                <a href="/produse" class="nav-link px-xl-3">Produse</a>
                <a href="/categorii" class="nav-link px-xl-3">Categorii</a>
                <a href="/ingrediente" class="nav-link px-xl-3">Ingrediente</a>
                <a href="/comenzi" class="nav-link px-xl-3">Comenzi</a>
                <a href="/mese" class="nav-link px-xl-3" sec:authorize="hasRole('ADMIN')">Mese</a>
                <a href="/utilizatori" class="nav-link px-xl-3">Personal</a>
                <a href="/schimbare-parola" class="nav-link px-xl-3">Parola</a>

                <span class="badge rounded-pill text-bg-light text-dark px-3 py-2 my-2 my-xl-0 ms-xl-2">
                    <span sec:authentication="name">User</span>
                </span>

                <form th:action="@{/logout}" method="post" class="ms-xl-2">
                    <button type="submit" class="btn btn-outline-light btn-sm w-100">Iesire</button>
                </form>
            </div>

            <div class="ms-auto py-3 py-xl-0" sec:authorize="!isAuthenticated()">
                <a href="/login" class="btn btn-light btn-sm fw-semibold px-3">Conectare</a>
            </div>
        </div>
    </div>
</nav>

<main class="flex-grow-1 py-4 py-lg-5">
    <div th:replace="${content}"></div>
</main>

<footer class="border-top bg-white py-4 mt-auto">
    <div class="container-fluid px-3 px-lg-4 d-flex flex-column flex-md-row justify-content-between gap-2 text-secondary small">
        <div>
            <span class="fw-semibold text-dark">Cafea Hub</span>
            <span>Management cafenea, stocuri si comenzi.</span>
        </div>
        <div class="d-flex gap-3">
            <span>&copy; 2026</span>
            <span>AWBD Project</span>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
