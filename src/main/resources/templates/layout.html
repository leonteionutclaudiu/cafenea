<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="iFrame(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CafeApp Premium</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4ecf7 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }
        .btn-animate {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-animate:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body class="d-flex flex-column">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm animate__animated animate__fadeInDown">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="/">☕ CafeApp Premium</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">

            <div class="d-flex align-items-center text-white" sec:authorize="isAuthenticated()">

                <a href="/schimbare-parola" class="btn btn-outline-warning btn-sm fw-bold btn-animate me-2 px-3">⚙️ Schimbă Parola</a>

                <a href="/register" sec:authorize="hasRole('ADMIN')" class="btn btn-outline-info btn-sm fw-bold btn-animate me-3 px-3">➕ Adaugă Personal</a>

                <span class="me-3 bg-light text-dark px-3 py-1 rounded-pill small fw-semibold">
                        Utilizator: <span class="text-primary" sec:authentication="name">User</span>
                    </span>

                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-danger btn-sm fw-bold btn-animate px-3">Ieșire</button>
                </form>
            </div>

            <div sec:authorize="!isAuthenticated()">
                <a href="/login" class="btn btn-outline-light btn-sm fw-bold btn-animate px-3">Conectare</a>
            </div>
        </div>
    </div>
</nav>

<main class="flex-grow-1">
    <div th:replace="${content}"></div>
</main>

<footer class="text-center text-muted py-4 mt-5 bg-white border-top shadow-sm animate__animated animate__fadeInUp">
    <div class="container small fw-medium">
        &copy; <span id="currentYear"></span> - CafeApp Enterprise Academic Project. Toate drepturile rezervate.
    </div>
    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();
    </script>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
