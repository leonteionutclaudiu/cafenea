<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - CafeApp</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 50px;">
<h2>Autentificare Sistem Cafenea</h2>

<div th:if="${param.error}" style="color:red; margin-bottom:15px;">Utilizator sau parolă incorectă!</div>
<div th:if="${param.logout}" style="color:green; margin-bottom:15px;">Te-ai deconectat cu succes.</div>

<form th:action="@{/login}" method="post" style="border: 1px solid #ccc; padding: 20px; width: 300px;">
    <label>Utilizator:</label><br/>
    <input type="text" name="username" style="width: 100%; margin-bottom: 10px;" required/><br/>

    <label>Parolă:</label><br/>
    <input type="password" name="password" style="width: 100%; margin-bottom: 20px;" required/><br/>

    <button type="submit" style="padding: 5px 15px;">Conectare</button>
</form>
</body>
</html>
